{{> helpbar}}
<div id="news">
	{{> navigation active="news"}}
	<header>
		<h1>{{title}}</h1>
	</header>	
	<main class="create">
		<form method="post">
			{{#if data._id}}
				<p> 
					{{#if data.draft}}
						<a href="{{{websiteUrl}}}/news/article/{{data.slug}}?draft={{data.draftUid}}" target="_blank">
							{{data.slug}}?draft={{data.draftUid}} 
						</a>
					{{else}}
						<a href="{{{websiteUrl}}}/news/article/{{data.slug}}" target="_blank">
							{{data.slug}} 
						</a> 
					{{/if}}
	 			</p>
 			{{/if}}
			<label>Title</label>
			<input name="title" type="text" value="{{data.title}}" required>
			
			{{> imagePicker data}}

			<br>

			<label>Content</label>
			<textarea class="svmde" name="contentMarkdown">{{data.contentMarkdown}}</textarea>
			
			<label>Notes <small>(sidebar)</small></label>
			<textarea class="svmde" name="notesMarkdown">{{data.notesMarkdown}}</textarea>

			<label>Publish now ?</label>
			<select name="draft">
				<option value="true" selected="selected">No, I will publish later (draft)</option>
				<option value="false">Yes, publish now</option>
			</select>
			<br>
			<button type="submit">Post</button>
		</form>
	</main>
</div>
