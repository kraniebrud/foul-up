<main id="main" class="help">
		<h1>Typing with markdown</h1>
		<br>
		{{#each data}}
		<article class="help-container">
			<header>
				<h3>{{header}}</h3>
			</header>
			<div class="content">
				<ol class="help-list">
				{{#each items}}
					<li>
						<div class="example">
							<p>{{{example}}}</p>
						</div>
						<small>
							<p><i>{{description}}</i></p>
							<br>
						</small>
						<p><b>Outcome:</b></p>
						<div class="md-content">{{{markdown md}}}</div>
					</li>
				{{/each}}
				</ol>
			</div>
		</article>
		{{/each}}
	</article>
</main>
